<!DOCTYPE html>
<html lang="{{ site.lang | default: 'en' }}">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ site.title }} | Efficient LLMs &amp; Post-training | XJTU</title>
    <meta name="description" content="{{ site.description | escape }}">
    <meta name="author" content="{{ site.title | escape }}">
    <meta name="robots" content="index, follow, max-image-preview:large">
    <meta name="color-scheme" content="light dark">
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#1c1c1d" media="(prefers-color-scheme: dark)">
    <link rel="canonical" href="{{ site.canonical }}">
    <meta property="og:type" content="profile">
    <meta property="og:title" content="Ruixuan Yang | Academic Homepage">
    <meta property="og:description" content="{{ site.description | escape }}">
    <meta property="og:url" content="{{ site.canonical }}">
    <meta property="og:site_name" content="Ruixuan Yang">
    <meta property="profile:first_name" content="Ruixuan">
    <meta property="profile:last_name" content="Yang">
    <meta name="twitter:card" content="summary">
    <meta name="twitter:title" content="Ruixuan Yang | Academic Homepage">
    <meta name="twitter:description" content="{{ site.description | escape }}">
    <link rel="icon" href="{{ site.favicon | relative_url }}" type="image/png">
    <link rel="icon" media="(prefers-color-scheme: dark)" href="{{ site.favicon_dark | relative_url }}" type="image/png">
    <link rel="preload" href="{{ '/assets/fonts/roboto-latin.woff2' | relative_url }}" as="font" type="font/woff2" crossorigin>
    <link rel="stylesheet" href="{{ '/assets/vendor/al-folio/tailwind.css' | relative_url }}">
    <link rel="stylesheet" href="{{ '/assets/vendor/al-folio/main.css' | relative_url }}">
    <link rel="stylesheet" href="{{ '/assets/css/custom.css' | relative_url }}?v={{ site.github.build_revision | default: 'al-folio-20260906' }}">
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@graph": [
        {
          "@type": "ProfilePage",
          "@id": "{{ site.canonical }}#profile",
          "url": {{ site.canonical | jsonify }},
          "name": "Ruixuan Yang | Academic Homepage",
          "description": {{ site.description | jsonify }},
          "inLanguage": "en",
          "mainEntity": {"@id": "{{ site.canonical }}#person"}
        },
        {
          "@type": "Person",
          "@id": "{{ site.canonical }}#person",
          "name": "Ruixuan Yang",
          "givenName": "Ruixuan",
          "familyName": "Yang",
          "url": {{ site.canonical | jsonify }},
          "image": {{ site.avatar | absolute_url | jsonify }},
          "jobTitle": "Undergraduate Student",
          "affiliation": {"@type": "CollegeOrUniversity", "name": "Xi'an Jiaotong University", "url": "https://www.xjtu.edu.cn/"},
          "knowsAbout": ["Large language models", "Model efficiency", "Token pruning", "Knowledge distillation", "Post-training", "On-policy distillation", "Chain-of-thought reasoning"],
          "sameAs": [{{ site.google_scholar | jsonify }}, {{ site.github_link | jsonify }}, "https://aclanthology.org/people/ruixuan-yang/"]
        }{% for paper in site.data.publications.main %},
        {
          "@type": "ScholarlyArticle",
          "@id": "{{ site.canonical }}#{{ paper.id }}",
          "headline": {{ paper.title | jsonify }},
          "name": {{ paper.title | jsonify }},
          "url": {{ paper.page | jsonify }},
          "description": {{ paper.summary | jsonify }},
          "isPartOf": {"@type": "CreativeWork", "name": {{ paper.venue | jsonify }}},
          "author": [{% for author in paper.authors %}{"@type": "Person", "name": {{ author.name | jsonify }}{% if author.name == site.title %}, "@id": "{{ site.canonical }}#person"{% endif %}}{% unless forloop.last %},{% endunless %}{% endfor %}]
        }{% endfor %}
      ]
    }
    </script>
  </head>
  <body class="fixed-top-nav">
    <a class="skip-link" href="#main">Skip to content</a>
    <header>
      <nav id="navbar" class="navbar navbar-light navbar-expand-sm fixed-top" aria-label="Main navigation">
        <div class="container">
          <a class="navbar-brand site-name" href="#about"><strong>Ruixuan</strong> Yang</a>
          <ul class="navbar-nav navbar-menu-list">
            <li class="nav-item"><a class="nav-link" href="#about">about</a></li>
            <li class="nav-item"><a class="nav-link" href="#research">research</a></li>
            <li class="nav-item"><a class="nav-link" href="#news">news</a></li>
            <li class="nav-item"><a class="nav-link" href="#publications">publications</a></li>
            <li class="nav-item"><a class="nav-link" href="#experience">experience</a></li>
          </ul>
        </div>
      </nav>
    </header>
    <main id="main" class="container mt-5">
      <div class="post">
        {{ content }}
      </div>
    </main>
    <footer class="site-footer" role="contentinfo">
      <div class="container">
        <span>© {{ site.time | date: '%Y' }} Ruixuan Yang</span>
        <span>Built with <a href="https://github.com/alshedivat/al-folio">al-folio</a>.</span>
      </div>
    </footer>
  </body>
</html>
