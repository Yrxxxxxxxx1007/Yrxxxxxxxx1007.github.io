bio: 'I am **Ruixuan Yang**, an undergraduate in the [School of Mathematics and Statistics](https://math.xjtu.edu.cn/)
  at [Xi''an Jiaotong University (XJTU)](https://www.xjtu.edu.cn/). I work on making large language models
  more efficient and improving their reasoning through post-training.


  I am currently a research intern in [Prof. Yulun Zhang''s group](https://yulunzhang.com/) at [Shanghai Jiao
  Tong University](https://en.sjtu.edu.cn/) and a visiting student in the [ENCODE Lab](https://westlake-encode-lab.github.io/)
  at [Westlake University](https://en.westlake.edu.cn/), advised by [Prof. Huan Wang](https://huanwang.tech/).

  '
