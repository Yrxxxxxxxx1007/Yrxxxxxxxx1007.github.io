name: Validate homepage

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build with the GitHub Pages environment
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./_site
      - name: Save the built website for preview
        uses: actions/upload-artifact@v4
        with:
          name: homepage-preview
          path: _site/
          retention-days: 7
